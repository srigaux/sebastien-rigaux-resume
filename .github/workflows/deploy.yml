name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Publish newly curated Prismic links throughout the day.
    - cron: "17 */4 * * *"
    # Refresh the experience-years figure embedded in the static PDFs.
    - cron: "0 6 1 2 *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          install: false
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Restore Astro image cache
        uses: actions/cache@v5
        with:
          path: apps/website-astro/.astro/cache
          key: astro-images-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/website-astro/astro.config.mjs', 'apps/website-astro/src/lib/watch-media.mjs', 'apps/website-astro/src/lib/watch-image-service.ts') }}-${{ github.run_id }}
          restore-keys: |
            astro-images-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/website-astro/astro.config.mjs', 'apps/website-astro/src/lib/watch-media.mjs', 'apps/website-astro/src/lib/watch-image-service.ts') }}-
      - name: Build with Astro
        run: pnpm --filter website-astro check && pnpm test:watch && pnpm build && pnpm check:watch-build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/website-astro/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
