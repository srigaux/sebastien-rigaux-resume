name: 🌐 Publish Astro website

on:
  push:
    branches: [master]
    paths:
      - "apps/website-astro/**"
      - "apps/cms-prismic/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  schedule:
    # Check for published Prismic changes every four hours; skip unchanged builds.
    - cron: "17 */4 * * *"
    # Refresh the experience-years figure embedded in the static PDFs.
    - cron: "0 6 1 2 *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Compare Prismic, website sources and the annual PDF refresh period with
  # the deployed fingerprint. Pushes, manual runs and the annual run force a build.
  check-content:
    name: 🔎 Check whether publication is needed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.content.outputs.changed }}
      fingerprint: ${{ steps.content.outputs.fingerprint }}
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: 🔎 Check published content for changes
        id: content
        run: node apps/website-astro/scripts/check-published-content.mjs

  build:
    name: 🛠️ Validate and build Astro website
    needs: check-content
    if: needs.check-content.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website-astro
    concurrency:
      group: github-pages-build
      # A newer build replaces an obsolete one without interrupting deployment.
      cancel-in-progress: true
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🟢 Set up Node.js
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: 📦 Set up pnpm
        uses: pnpm/setup@v3
        with:
          install: false
      - name: 🔗 Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: ♻️ Restore Astro build cache
        uses: actions/cache@v5
        with:
          path: apps/website-astro/.astro/cache
          key: astro-images-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/website-astro/astro.config.mjs', 'apps/website-astro/src/lib/watch-media.mjs', 'apps/website-astro/src/lib/watch-image-service.ts') }}-${{ github.run_id }}
          restore-keys: |
            astro-images-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/website-astro/astro.config.mjs', 'apps/website-astro/src/lib/watch-media.mjs', 'apps/website-astro/src/lib/watch-image-service.ts') }}-
      - name: 🔎 Check Astro types and diagnostics
        run: pnpm check
      - name: 🧪 Run website tests
        run: pnpm test
      - name: 🛠️ Build Astro site
        run: pnpm build
      - name: ✅ Validate tech-watch build output
        run: pnpm check:watch-build
      - name: 📝 Record content fingerprint for deployment
        env:
          CONTENT_FINGERPRINT: ${{ needs.check-content.outputs.fingerprint }}
        run: node scripts/check-published-content.mjs write
      - name: 📤 Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/website-astro/dist

  deploy:
    name: 🚀 Publish website to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deploy
      # Let the active deployment finish; retain only the latest pending one.
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
