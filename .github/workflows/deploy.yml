name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Publish newly curated Prismic links throughout the day.
    - cron: "17 */4 * * *"
    # Refresh the experience-years figure embedded in the static PDFs.
    - cron: "0 6 1 2 *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          build-cmd: pnpm run check && pnpm run test:watch && pnpm run build && pnpm run check:watch-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
