name: 🚀 Publish Astro website
run-name: ${{ inputs.run_title || github.event.head_commit.message || format('🚀 Manual publication · {0}', github.actor) }}

on:
  push:
    branches: [master]
    paths:
      - 'apps/website-astro/**'
      - 'apps/cms-prismic/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/check-website-updates.yml'
  workflow_dispatch:
    inputs:
      run_title:
        description: Optional publication title (filled by the scheduled content check)
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Capture a fresh fingerprint before building. Every publication run is forced;
  # the separate scheduled workflow dispatches this one only when needed.
  check-content:
    name: 🔎 Capture published content version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.content.outputs.changed }}
      fingerprint: ${{ steps.content.outputs.fingerprint }}
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: 🔎 Capture content fingerprint before building
        id: content
        run: node apps/website-astro/scripts/check-published-content.mjs

  build:
    name: 🛠️ Validate and build Astro website
    needs: check-content
    if: needs.check-content.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website-astro
    concurrency:
      group: cloudflare-pages-build
      # A newer build replaces an obsolete one without interrupting deployment.
      cancel-in-progress: true
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🟢 Set up Node.js
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: 📦 Set up pnpm
        uses: pnpm/setup@v3
        with:
          install: false
      - name: 🔗 Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: ♻️ Restore Astro build cache
        uses: actions/cache@v5
        with:
          path: apps/website-astro/.astro/cache
          key: astro-images-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/website-astro/astro.config.mjs', 'apps/website-astro/src/lib/watch-media.mjs', 'apps/website-astro/src/lib/watch-image-service.ts') }}-${{ github.run_id }}
          restore-keys: |
            astro-images-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/website-astro/astro.config.mjs', 'apps/website-astro/src/lib/watch-media.mjs', 'apps/website-astro/src/lib/watch-image-service.ts') }}-
      - name: 🔎 Check Astro types and diagnostics
        run: pnpm check
      - name: 🧪 Run website tests
        run: pnpm test
      - name: 🛠️ Build Astro site
        run: pnpm build
      - name: ✅ Validate tech-watch build output
        run: pnpm check:watch-build
      - name: 📝 Record content fingerprint for deployment
        env:
          CONTENT_FINGERPRINT: ${{ needs.check-content.outputs.fingerprint }}
        run: node scripts/check-published-content.mjs write
      - name: ✅ Validate Cloudflare Pages artifact
        run: node scripts/check-pages-build.mjs
      - name: 📤 Upload Cloudflare Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages
          path: apps/website-astro/dist
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: 🚀 Publish website to Cloudflare Pages
    needs: [build, check-content]
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages-deploy
      cancel-in-progress: false
    environment:
      name: cloudflare-pages
      url: https://sebastien.rigaux.be
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: 📥 Download validated website
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages
          path: apps/website-astro/dist
      - name: 📦 Set up pnpm
        uses: pnpm/setup@v3
        with:
          install: false
      - name: 🔗 Install locked deployment tooling
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile
      - name: 🚀 Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter website-astro exec wrangler pages deploy dist --project-name=sebastien-rigaux --branch=master
      - name: ✅ Verify Pages deployment before domain checks
        env:
          EXPECTED_FINGERPRINT: ${{ needs.check-content.outputs.fingerprint }}
        run: node apps/website-astro/scripts/check-pages-live.mjs https://sebastien-rigaux.pages.dev
      - name: ✅ Verify production domain and negotiated representations
        if: vars.CLOUDFLARE_DOMAIN_ACTIVE == 'true'
        env:
          EXPECTED_FINGERPRINT: ${{ needs.check-content.outputs.fingerprint }}
        run: node apps/website-astro/scripts/check-pages-live.mjs https://sebastien.rigaux.be
